name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Hosted runners have no CUDA device, so the Triton kernel tests
      # (gemm, attention, flash-decoding, fp8/int4/splitk) and the raw-CUDA
      # NVRTC demo cannot execute here, and the GPTQ quant test imports PicoLM.
      # They run locally on the RTX 5070 with `pytest tests/ -q` (see README for
      # the measured numbers). This job keeps a floor: every source file must
      # at least parse.
      - name: Syntax-check all Python sources
        run: python -m compileall -q .
